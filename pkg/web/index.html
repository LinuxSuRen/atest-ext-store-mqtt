<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT Web Viewer</title>
<style>
:root {
  --bg: #1a1b23;
  --surface: #24252f;
  --surface-hover: #2e2f3a;
  --border: #37384a;
  --text: #e1e2e7;
  --text-muted: #8b8d9e;
  --primary: #6c8aff;
  --primary-hover: #5b78e8;
  --danger: #e0556a;
  --danger-hover: #c94d5f;
  --success: #4ecb71;
  --warning: #f0a040;
  --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: 18px;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Connection Bar */
#conn-bar {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#conn-bar input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}
#conn-bar input:focus { border-color: var(--primary); }
#conn-bar input::placeholder { color: var(--text-muted); }
#broker { width: 260px; }
#mqtt-user, #mqtt-pass { width: 140px; }
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, opacity .2s;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-outline:hover:not(:disabled) { background: var(--surface-hover); }
.status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.disconnected { background: var(--text-muted); }
.status-dot.connected { background: var(--success); }
.gh-link {
  margin-left: auto;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  transition: color .15s;
  white-space: nowrap;
}
.gh-link:hover { color: var(--primary); }

/* Subscribe Bar */
#sub-bar {
  display: flex;
  gap: 8px;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-shrink: 0;
}
#sub-bar input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px;
  font-family: var(--font-mono);
  outline: none;
}
#sub-bar input:focus { border-color: var(--primary); }
#sub-bar input::placeholder { color: var(--text-muted); }

/* Main Content */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left Panel - Topics */
#left-panel {
  width: 320px;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--surface);
}
#topic-filter {
  margin: 8px;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  font-size: 15px;
  outline: none;
  flex-shrink: 0;
}
#topic-filter:focus { border-color: var(--primary); }
#topic-filter::placeholder { color: var(--text-muted); }
#topic-list {
  flex: 1;
  overflow-y: auto;
  list-style: none;
}
#topic-list li {
  padding: 12px 20px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .15s;
  word-break: break-all;
}
#topic-list li:hover { background: var(--surface-hover); }
#topic-list li.active {
  background: var(--primary);
  color: #fff;
}
.topic-count {
  font-size: 13px;
  color: var(--text-muted);
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
  margin-left: 8px;
}
#topic-list li.active .topic-count {
  background: rgba(255,255,255,.2);
  color: #fff;
}
#topic-list li .topic-del {
  visibility: hidden;
  width: 24px;
  height: 24px;
  line-height: 24px;
  text-align: center;
  border-radius: 4px;
  font-size: 16px;
  color: var(--text-muted);
  cursor: pointer;
  flex-shrink: 0;
  margin-left: 4px;
  transition: color .15s, background .15s;
}
#topic-list li:hover .topic-del { visibility: visible; }
#topic-list li .topic-del:hover { color: var(--danger); background: rgba(224,85,106,.15); }
#topic-list li.active .topic-del { color: rgba(255,255,255,.7); visibility: visible; }
#topic-list li.active .topic-del:hover { color: #ffb3b3; background: rgba(255,255,255,.15); }
#topic-list .empty {
  padding: 28px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 15px;
  cursor: default;
}

/* Right Panel - Messages */
#right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#message-header {
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#message-header strong {
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 15px;
}
#message-header .msg-count {
  font-size: 14px;
}
#clear-btn {
  font-size: 14px;
  padding: 5px 12px;
}
#message-list {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}
#message-list .msg {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
  line-height: 1.7;
}
#message-list .msg:hover { background: var(--surface-hover); }
.msg-meta {
  display: flex;
  gap: 12px;
  margin-bottom: 4px;
  font-size: 13px;
  color: var(--text-muted);
}
.msg-payload {
  font-family: var(--font-mono);
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text);
  background: var(--bg);
  padding: 8px;
  border-radius: var(--radius);
}
#message-list .empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: var(--text-muted);
  font-size: 16px;
}

/* Resizer */
#resizer {
  width: 4px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background .15s;
}
#resizer:hover { background: var(--primary); }

/* Clients Panel */
#clients-bar {
  display: flex;
  gap: 8px;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-shrink: 0;
  font-size: 14px;
  color: var(--text-muted);
}
#clients-bar .broker-type {
  background: var(--bg);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
#clients-bar .client-count {
  cursor: pointer;
  transition: color .15s;
}
#clients-bar .client-count:hover { color: var(--primary); }
#clients-panel {
  display: none;
  padding: 0 16px 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  max-height: 200px;
  overflow-y: auto;
  flex-shrink: 0;
}
#clients-panel.open { display: block; }
#clients-panel table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
#clients-panel th {
  text-align: left;
  padding: 4px 8px;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
}
#clients-panel td {
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 13px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 15px;
  color: #fff;
  z-index: 100;
  animation: slideIn .3s ease;
  max-width: 400px;
}
.toast.error { background: var(--danger); }
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); color: #1a1b23; }
@keyframes slideIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>
<body>

<!-- Connection Bar -->
<div id="conn-bar">
  <span class="status-dot disconnected" id="status-dot" title="Disconnected"></span>
  <input id="broker" placeholder="mqtt://broker:1883" autocomplete="off">
  <input id="mqtt-user" placeholder="Username" autocomplete="off">
  <input id="mqtt-pass" type="password" placeholder="Password" autocomplete="off">
  <button id="connect-btn" class="btn btn-primary">Connect</button>
  <button id="disconnect-btn" class="btn btn-danger" disabled>Disconnect</button>
  <a href="https://github.com/LinuxSuRen/atest-ext-store-mqtt" target="_blank" class="gh-link" title="View on GitHub">GitHub↗</a>
</div>

<!-- Subscribe Bar -->
<div id="sub-bar">
  <input id="topic-input" placeholder="Topic to subscribe (e.g. sensors/#)" autocomplete="off" disabled>
  <button id="sub-btn" class="btn btn-primary" disabled>Subscribe</button>
</div>

<!-- Clients Bar -->
<div id="clients-bar" style="display:none">
  Broker: <span class="broker-type" id="broker-type">-</span>
  <span class="client-count" id="client-count" onclick="toggleClients()"></span>
</div>
<div id="clients-panel">
  <table id="clients-table">
    <thead><tr><th>Client ID</th><th>Username</th><th>IP</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- Main Content -->
<div id="main">
  <div id="left-panel">
    <input id="topic-filter" placeholder="Filter topics..." disabled>
    <ul id="topic-list"></ul>
  </div>
  <div id="resizer"></div>
  <div id="right-panel">
    <div id="message-header">
      <span>Select a topic to view messages</span>
    </div>
    <div id="message-list">
      <div class="empty-state">No topic selected</div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'mqtt-web-viewer';
const state = {
  sessionId: null,
  connected: false,
  selectedTopic: null,
  messages: {},     // topic -> [{topic, payload, timestamp}]
  eventSource: null,
};

// Load from localStorage
function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      document.getElementById('broker').value = saved.broker || '';
      document.getElementById('mqtt-user').value = saved.username || '';
      document.getElementById('mqtt-pass').value = saved.password || '';
    }
  } catch (_) {}
}
function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    broker: document.getElementById('broker').value,
    username: document.getElementById('mqtt-user').value,
    password: document.getElementById('mqtt-pass').value,
  }));
}

// DOM refs
const $ = id => document.getElementById(id);
const statusDot = $('status-dot');
const connectBtn = $('connect-btn');
const disconnectBtn = $('disconnect-btn');
const topicInput = $('topic-input');
const subBtn = $('sub-btn');
const topicFilter = $('topic-filter');
const topicList = $('topic-list');
const messageHeader = $('message-header');
const messageList = $('message-list');

// Toast
function toast(msg, type = 'error') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// Set connected state
function setConnected(connected) {
  state.connected = connected;
  statusDot.className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
  statusDot.title = connected ? 'Connected' : 'Disconnected';
  connectBtn.disabled = connected;
  disconnectBtn.disabled = !connected;
  connectBtn.textContent = 'Connect';
  topicInput.disabled = !connected;
  subBtn.disabled = !connected;
  topicFilter.disabled = !connected;

  $('broker').disabled = connected;
  $('mqtt-user').disabled = connected;
  $('mqtt-pass').disabled = connected;

  if (!connected) {
    state.sessionId = null;
    state.selectedTopic = null;
    state.messages = {};
    if (state.eventSource) {
      state.eventSource.close();
      state.eventSource = null;
    }
    renderTopics();
    renderMessages();
    messageHeader.innerHTML = '<span>Select a topic to view messages</span>';
    stopClientPolling();
    $('clients-bar').style.display = 'none';
    $('clients-panel').classList.remove('open');
  }
}

let clientsTimer = null;
function startClientPolling() {
  pollClients();
  clientsTimer = setInterval(pollClients, 10000);
}
function stopClientPolling() {
  if (clientsTimer) { clearInterval(clientsTimer); clientsTimer = null; }
}
async function pollClients() {
  if (!state.sessionId) return;
  try {
    const res = await fetch('/api/clients?sessionId=' + state.sessionId);
    const data = await res.json();
    if (data.type && data.type !== 'unknown') {
      $('clients-bar').style.display = 'flex';
      $('broker-type').textContent = data.type;
      const count = data.total || (data.clients && data.clients.length) || 0;
      $('client-count').textContent = count + ' client' + (count !== 1 ? 's' : '') + ' connected';
      renderClients(data.clients || []);
    }
  } catch (_) {}
}
function renderClients(clients) {
  const tbody = document.querySelector('#clients-table tbody');
  tbody.innerHTML = clients.map(c =>
    '<tr>' +
      '<td>' + escapeHtml(c.clientId) + '</td>' +
      '<td>' + escapeHtml(c.username || '-') + '</td>' +
      '<td>' + escapeHtml(c.ip || '-') + '</td>' +
      '<td style="color:' + (c.connected ? 'var(--success)' : 'var(--text-muted)') + '">' +
        (c.connected ? 'online' : 'offline') +
      '</td>' +
    '</tr>'
  ).join('');
}
function toggleClients() {
  $('clients-panel').classList.toggle('open');
}
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// API helpers
async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// Connect
connectBtn.onclick = async () => {
  saveStorage();
  const broker = $('broker').value.trim();
  if (!broker) { toast('Broker URL is required'); return; }
  try {
    connectBtn.disabled = true;
    connectBtn.textContent = 'Connecting...';
    const data = await api('/api/connect', {
      broker,
      username: $('mqtt-user').value,
      password: $('mqtt-pass').value,
    });
    state.sessionId = data.sessionId;
    setConnected(true);
    startSSE();
    startClientPolling();
    toast('Connected to ' + broker, 'success');
  } catch (e) {
    toast(e.message, 'error');
    connectBtn.disabled = false;
    connectBtn.textContent = 'Connect';
  }
};

// Disconnect
disconnectBtn.onclick = async () => {
  if (!state.sessionId) return;
  try {
    await api('/api/disconnect', { sessionId: state.sessionId });
  } catch (_) {}
  setConnected(false);
  connectBtn.textContent = 'Connect';
};

// Subscribe
subBtn.onclick = async () => {
  const topic = topicInput.value.trim();
  if (!topic) { toast('Topic is required'); return; }
  try {
    await api('/api/subscribe', { sessionId: state.sessionId, topic });
    if (!state.messages[topic]) state.messages[topic] = [];
    if (!state.selectedTopic) selectTopic(topic);
    renderTopics();
    topicInput.value = '';
    toast('Subscribed to ' + topic, 'success');
  } catch (e) {
    if (e.message.includes('already subscribed')) {
      toast('Already subscribed to ' + topic, 'warning');
    } else {
      toast(e.message, 'error');
    }
  }
};

// Unsubscribe
async function unsubscribeTopic(topic) {
  try {
    await api('/api/unsubscribe', { sessionId: state.sessionId, topic });
    delete state.messages[topic];
    if (state.selectedTopic === topic) {
      state.selectedTopic = null;
      renderMessages();
      messageHeader.innerHTML = '<span>Select a topic to view messages</span>';
    }
    renderTopics();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// Topic selection
function selectTopic(topic) {
  state.selectedTopic = topic;
  renderTopics();
  renderMessages();
  messageHeader.innerHTML = '<strong>' + escapeHtml(topic) + '</strong>' +
    '<span class="msg-count">' + (state.messages[topic] || []).length + ' messages</span>';
}

// SSE
function startSSE() {
  if (state.eventSource) state.eventSource.close();

  const es = new EventSource('/api/events?sessionId=' + encodeURIComponent(state.sessionId));
  state.eventSource = es;

  es.addEventListener('connected', () => {
    console.log('[SSE] connected');
  });

  es.addEventListener('message', (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (!state.messages[msg.topic]) state.messages[msg.topic] = [];
      state.messages[msg.topic].push(msg);
      // Keep last 500 messages per topic
      if (state.messages[msg.topic].length > 500) {
        state.messages[msg.topic] = state.messages[msg.topic].slice(-500);
      }
      renderTopics();
      if (state.selectedTopic === msg.topic) {
        renderMessages();
        messageHeader.innerHTML = '<strong>' + escapeHtml(msg.topic) + '</strong>' +
          '<span class="msg-count">' + state.messages[msg.topic].length + ' messages</span>';
      }
    } catch (_) {}
  });

  es.addEventListener('disconnected', () => {
    setConnected(false);
    connectBtn.textContent = 'Connect';
    toast('MQTT broker disconnected', 'warning');
  });

  es.onerror = () => {
    // SSE will auto-reconnect
  };
}

// Render topic list
function renderTopics() {
  const filter = (topicFilter.value || '').toLowerCase();
  const topics = Object.keys(state.messages).sort();
  const filtered = topics.filter(t => t.toLowerCase().includes(filter));

  if (filtered.length === 0) {
    topicList.innerHTML = '<li class="empty">' +
      (topics.length === 0 ? 'No topics. Subscribe to a topic above.' : 'No topics match filter.') +
      '</li>';
    return;
  }

  topicList.innerHTML = filtered.map(t => {
    const count = state.messages[t].length;
    const active = t === state.selectedTopic ? ' class="active"' : '';
    return '<li' + active + ' data-topic="' + escapeHtml(t) + '">' +
      '<span>' + escapeHtml(t) + '</span>' +
      '<span class="topic-count">' + count + '</span>' +
      '<span class="topic-del" title="Unsubscribe">✕</span>' +
      '</li>';
  }).join('');

  // Click handlers
  topicList.querySelectorAll('li[data-topic]').forEach(li => {
    li.onclick = () => selectTopic(li.dataset.topic);
    const delBtn = li.querySelector('.topic-del');
    if (delBtn) {
      delBtn.onclick = (e) => {
        e.stopPropagation();
        unsubscribeTopic(li.dataset.topic);
      };
    }
  });
}

// Render messages for selected topic
function renderMessages() {
  const msgs = state.selectedTopic ? (state.messages[state.selectedTopic] || []) : [];
  if (msgs.length === 0) {
    messageList.innerHTML = '<div class="empty-state">' +
      (state.selectedTopic ? 'Waiting for messages...' : 'No topic selected') +
      '</div>';
    return;
  }

  messageList.innerHTML = msgs.slice().reverse().map(m =>
    '<div class="msg">' +
      '<div class="msg-meta">' +
        '<span>' + escapeHtml(m.topic) + '</span>' +
        '<span>' + escapeHtml(m.timestamp) + '</span>' +
      '</div>' +
      '<div class="msg-payload">' + escapeHtml(m.payload) + '</div>' +
    '</div>'
  ).join('');
  messageList.scrollTop = 0;
}

// Topic filter
topicFilter.oninput = renderTopics;

// Enter key on topic input
topicInput.onkeydown = (e) => {
  if (e.key === 'Enter' && !subBtn.disabled) subBtn.click();
};

// Resizer
const resizer = $('resizer');
const leftPanel = $('left-panel');
let resizeX = 0, resizeW = 0;
resizer.onmousedown = (e) => {
  resizeX = e.clientX;
  resizeW = leftPanel.offsetWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  document.onmousemove = (e) => {
    const w = Math.max(200, Math.min(600, resizeW + e.clientX - resizeX));
    leftPanel.style.width = w + 'px';
  };
  document.onmouseup = () => {
    document.onmousemove = null;
    document.onmouseup = null;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  };
};

function escapeHtml(str) {
  const el = document.createElement('span');
  el.textContent = str;
  return el.innerHTML;
}

// Init
loadStorage();
setConnected(false);
renderTopics();
</script>
</body>
</html>
